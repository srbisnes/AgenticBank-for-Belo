name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install tsx
        run: npm install -g tsx
      - name: Run examples/demo.ts
        run: tsx examples/demo.ts
